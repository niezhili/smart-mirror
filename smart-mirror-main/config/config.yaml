#==============参数配置===============================
vad:
  #音频录制超时配置，单位均为s
  timeout: 600
  #静音时长，用于确认话说完了
  silence: 1
  #人声置信度 百分比
  confidence: 0.3
  #音频缓存数量限制
  max_temp_num: 3
  #音频录制最短连续帧限制
  min_cont_frames: 3

text_processor:
  # 控制每个文本切割块的最大长度
  max_split_len: 40